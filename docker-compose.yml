# Base de datos de NEXORA para desarrollo: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    container_name: nexora-postgres
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
    ports:
      - "5432:5432"
    volumes:
      - nexora-datos:/var/lib/postgresql/data

volumes:
  nexora-datos:
