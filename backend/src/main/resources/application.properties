spring.application.name=nexora-backend
server.port=8080

# Base de datos (PostgreSQL). Se pueden cambiar con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexora}
spring.datasource.username=${DB_USER:nexora}
spring.datasource.password=${DB_PASSWORD:nexora}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true

# Fecha de referencia de la demo (zona horaria de Lima).
nexora.zona-horaria=America/Lima
# Si la base está vacía al arrancar, carga los datos de demostración.
nexora.demo.cargar-al-iniciar=true
# Origen del frontend (Vite).
nexora.cors.origen=${FRONTEND_URL:http://localhost:5173}
# Horas de validez del token de sesión.
nexora.sesion.horas=12
