 <div id="buyer-header"></div>
 <div class="nx-layout cp-layout">
  <div class="nx-stack">
   <div class="cp-tools">
    <div class="nx-toolbar"><label class="nx-search"><span class="sr">Buscar producto</span><svg class="ic" aria-hidden="true"><use href="#search"/></svg><input id="catalog-search" type="search" placeholder="Buscar aceite, arroz…"></label></div>

 </div>
